<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeFlow - Quản lý đội ngũ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.4); backdrop-filter: blur(2px); }
        .glass-header { background-color: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); }
    </style>
</head>
<body class="min-h-screen bg-white text-slate-900">

    <!-- Top Navigation Header -->
    <header class="fixed top-0 left-0 right-0 h-16 glass-header border-b border-gray-100 z-40 px-6 flex items-center justify-between">
        <div class="flex items-center gap-8">
            <div class="flex items-center gap-2 cursor-pointer">
                <div class="w-8 h-8 bg-black rounded-lg flex items-center justify-center text-white font-bold">C</div>
                <span class="font-bold text-lg tracking-tight">CodeFlow</span>
            </div>
            
            <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-gray-500">
                <a href="#" class="text-black border-b-2 border-black py-5">Thành viên</a>
                <a href="#" class="hover:text-black transition-colors py-5">Dự án</a>
                <a href="#" class="hover:text-black transition-colors py-5">Tài liệu</a>
                <a href="#" class="hover:text-black transition-colors py-5">Lịch trình</a>
            </nav>
        </div>

        <div class="flex items-center gap-4">
            <div class="relative hidden sm:block">
                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 w-4 h-4"></i>
                <input 
                    type="text" 
                    placeholder="Tìm kiếm..." 
                    class="pl-10 pr-4 py-1.5 bg-gray-50 border-transparent focus:bg-white focus:border-gray-200 rounded-full text-sm outline-none w-48 transition-all"
                >
            </div>
            <button class="p-2 text-gray-400 hover:text-black hover:bg-gray-50 rounded-full transition-colors">
                <i data-lucide="bell" class="w-5 h-5"></i>
            </button>
            <div class="w-8 h-8 rounded-full bg-gray-200 border border-gray-100"></div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="pt-24 pb-12 px-6 max-w-7xl mx-auto">
        <!-- Page Title & Actions -->
        <section class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-10">
            <div>
                <h1 class="text-3xl font-bold tracking-tight">Quản lý đội ngũ</h1>
                <p class="text-gray-500 mt-1">Quản lý quyền hạn và vai trò các thành viên trong dự án code.</p>
            </div>
            
            <button 
                onclick="openModal()"
                class="flex items-center justify-center gap-2 bg-black text-white px-6 py-2.5 rounded-full font-medium hover:bg-gray-800 transition-all active:scale-95 shadow-lg shadow-gray-200"
            >
                <i data-lucide="plus" class="w-4.5 h-4.5"></i>
                <span>Thêm nhân sự mới</span>
            </button>
        </section>

        <!-- Members Grid -->
        <div id="members-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Members will be rendered here by JS -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden col-span-full py-20 border-2 border-dashed border-gray-100 rounded-3xl flex flex-col items-center justify-center">
            <div class="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center text-gray-300 mb-4">
                <i data-lucide="users" class="w-8 h-8"></i>
            </div>
            <p class="text-gray-400 font-medium">Danh sách trống. Hãy thêm thành viên đầu tiên.</p>
        </div>
    </main>

    <!-- Modern Modal -->
    <div id="add-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 modal-overlay animate-in fade-in duration-200">
        <div class="bg-white w-full max-w-md rounded-[2rem] shadow-2xl p-10 border border-gray-100 scale-95 transition-transform duration-200" id="modal-content">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-gray-50 rounded-2xl flex items-center justify-center mx-auto mb-4 text-black">
                    <i data-lucide="plus" class="w-8 h-8"></i>
                </div>
                <h2 class="text-2xl font-bold">Thành viên mới</h2>
                <p class="text-gray-400 text-sm mt-1">Điền thông tin để mời vào dự án</p>
            </div>
            
            <form id="add-member-form" class="space-y-5">
                <div class="space-y-1.5">
                    <label class="text-[13px] font-bold uppercase tracking-wider text-gray-400 ml-1">Tên đầy đủ</label>
                    <input 
                        id="name-input"
                        type="text" 
                        class="w-full px-5 py-3 rounded-2xl bg-gray-50 border-transparent focus:bg-white focus:border-black outline-none transition-all"
                        placeholder="Ví dụ: Nguyễn Văn A"
                        required
                    />
                </div>
                
                <div class="space-y-1.5">
                    <label class="text-[13px] font-bold uppercase tracking-wider text-gray-400 ml-1">Địa chỉ Email</label>
                    <input 
                        id="email-input"
                        type="email" 
                        class="w-full px-5 py-3 rounded-2xl bg-gray-50 border-transparent focus:bg-white focus:border-black outline-none transition-all"
                        placeholder="name@company.com"
                        required
                    />
                </div>
                
                <div class="space-y-1.5">
                    <label class="text-[13px] font-bold uppercase tracking-wider text-gray-400 ml-1">Vai trò dự án</label>
                    <div class="relative">
                        <select 
                            id="role-input"
                            class="w-full px-5 py-3 rounded-2xl bg-gray-50 border-transparent focus:bg-white focus:border-black outline-none transition-all appearance-none"
                        >
                            <option value="Dev">Dev</option>
                            <option value="Designer">Designer</option>
                            <option value="Marketing">Marketing</option>
                            <option value="Coder">Coder</option>
                            <option value="Project Manager">Project Manager</option>
                        </select>
                        <i data-lucide="chevron-down" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none w-4.5 h-4.5"></i>
                    </div>
                </div>

                <div class="pt-6 flex gap-3">
                    <button 
                        type="button"
                        onclick="closeModal()"
                        class="flex-1 px-4 py-4 text-gray-500 font-bold hover:text-black transition-colors"
                    >
                        Đóng
                    </button>
                    <button 
                        type="submit"
                        class="flex-[2] px-4 py-4 bg-black text-white rounded-2xl font-bold hover:bg-gray-800 transition-all shadow-xl shadow-gray-200"
                    >
                        Xác nhận thêm
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Data State
        let members = [
            { id: 1, name: "Nguyễn Văn A", role: "Dev", email: "vana@dev.com", status: "Online" },
            { id: 2, name: "Trần Thị B", role: "Designer", email: "thib@design.com", status: "Busy" },
            { id: 3, name: "Lê Văn C", role: "Marketing", email: "vanc@mkt.com", status: "Offline" },
            { id: 4, name: "Phạm Minh D", role: "Coder", email: "minhd@code.com", status: "Online" },
        ];

        // UI Selectors
        const grid = document.getElementById('members-grid');
        const emptyState = document.getElementById('empty-state');
        const modal = document.getElementById('add-modal');
        const form = document.getElementById('add-member-form');

        // Helper: Get Role Styling
        function getRoleBadge(role) {
            const base = "px-2.5 py-0.5 rounded-full text-[11px] font-bold uppercase tracking-wider border ";
            switch (role) {
                case 'Dev': return base + 'bg-blue-50 text-blue-600 border-blue-100';
                case 'Designer': return base + 'bg-purple-50 text-purple-600 border-purple-100';
                case 'Marketing': return base + 'bg-orange-50 text-orange-600 border-orange-100';
                case 'Coder': return base + 'bg-emerald-50 text-emerald-600 border-emerald-100';
                default: return base + 'bg-gray-50 text-gray-600 border-gray-100';
            }
        }

        // Helper: Get Status Color
        function getStatusClass(status) {
            if (status === 'Online') return 'bg-green-500';
            if (status === 'Busy') return 'bg-amber-500';
            return 'bg-gray-300';
        }

        // Render Function
        function render() {
            grid.innerHTML = '';
            
            if (members.length === 0) {
                emptyState.classList.remove('hidden');
                grid.classList.add('hidden');
            } else {
                emptyState.classList.add('hidden');
                grid.classList.remove('hidden');
            }

            members.forEach(member => {
                const card = document.createElement('div');
                card.className = "group relative bg-white border border-gray-100 rounded-2xl p-6 hover:shadow-xl hover:shadow-gray-100 transition-all duration-300";
                
                const initials = member.name.split(' ').pop().charAt(0);
                
                card.innerHTML = `
                    <button 
                        onclick="removeMember(${member.id})"
                        class="absolute top-4 right-4 p-2 text-gray-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity"
                    >
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>

                    <div class="flex flex-col items-center text-center">
                        <div class="relative mb-4">
                            <div class="w-20 h-20 rounded-2xl bg-gray-50 flex items-center justify-center text-2xl font-bold text-gray-400 border border-gray-100">
                                ${initials}
                            </div>
                            <div class="absolute -bottom-1 -right-1 w-4 h-4 rounded-full border-2 border-white ${getStatusClass(member.status)}"></div>
                        </div>

                        <h3 class="font-bold text-lg leading-tight">${member.name}</h3>
                        <p class="text-gray-400 text-sm mb-4">${member.email}</p>
                        
                        <div class="mt-auto">
                            <span class="${getRoleBadge(member.role)}">
                                ${member.role}
                            </span>
                        </div>
                    </div>

                    <div class="mt-6 pt-6 border-t border-gray-50 flex items-center justify-between gap-2">
                        <button class="flex-1 text-xs font-semibold py-2 rounded-lg bg-gray-50 hover:bg-gray-100 transition-colors">Hồ sơ</button>
                        <button class="flex-1 text-xs font-semibold py-2 rounded-lg border border-gray-100 hover:bg-gray-50 transition-colors">Nhắn tin</button>
                    </div>
                `;
                grid.appendChild(card);
            });
            
            lucide.createIcons();
        }

        // Actions
        window.openModal = () => {
            modal.classList.remove('hidden');
            setTimeout(() => {
                document.getElementById('modal-content').classList.remove('scale-95');
                document.getElementById('modal-content').classList.add('scale-100');
            }, 10);
        };

        window.closeModal = () => {
            document.getElementById('modal-content').classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 150);
        };

        window.removeMember = (id) => {
            members = members.filter(m => m.id !== id);
            render();
        };

        form.onsubmit = (e) => {
            e.preventDefault();
            const name = document.getElementById('name-input').value;
            const email = document.getElementById('email-input').value;
            const role = document.getElementById('role-input').value;

            const newMember = {
                id: Date.now(),
                name,
                email,
                role,
                status: 'Online'
            };

            members.push(newMember);
            form.reset();
            closeModal();
            render();
        };

        // Initialize
        window.onload = () => {
            render();
        };
    </script>
</body>
</html>
